# Development version of Configurations

server:
  port: 8083

# Database connections
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/authdb}
    # If env var exists -> use it (Docker)
    # If not -> fallback to localhost (IDE)
    username: ${SPRING_DATASOURCE_USERNAME:authuser}
    password: ${SPRING_DATASOURCE_PASSWORD:authpass}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate: # hibernate dialect answers "how should I generate SQL for this db?"
        dialect: org.hibernate.dialect.MySQLDialect # Spring boot auto-detects from the JDBC driver for mysql 8+, so we can skip it
        format_sql: true
    show-sql: true

# Don't over-tune Hikari (keep them in prod), defaults are already good

